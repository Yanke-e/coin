name: Crypto Intelligence

on:
  schedule:
    - cron: "15 5,17 * * *"   # full refresh twice a day (dashboard data)
    - cron: "20 * * * *"      # hourly alert check (news + volume)
    - cron: "30 6 * * 1"      # weekly spike lab
  workflow_dispatch:
    inputs:
      mode:
        description: "full | alerts | spikelab | test-email"
        required: true
        default: "full"
        type: choice
        options: [full, alerts, spikelab, test-email]

permissions:
  contents: write

concurrency:
  group: crypto-intel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick mode
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "15 5,17 * * *") MODE=full ;;
            "30 6 * * 1")    MODE=spikelab ;;
            "20 * * * *")    MODE=alerts ;;
            *)               MODE="${{ github.event.inputs.mode }}" ;;
          esac
          echo "mode=${MODE:-full}" >> "$GITHUB_OUTPUT"

      - name: Run engine
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python fetch_crypto.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A crypto_data.json alerts_state.json spike_lab.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(${{ steps.mode.outputs.mode }}): $(date -u +%FT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
